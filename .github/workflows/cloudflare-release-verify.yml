name: cloudflare-release-verify

# Manual check that a Cloudflare origin serves the release built from a given ref.
# Cloudflare deploys are manual (wrangler deploy by the deployment owner); a Vercel
# status or a merge is NOT evidence that Cloudflare serves new code. This workflow:
#   1. builds the expected static release from `ref` exactly as a deploy would
#      (frontend build + cloudflare/build.py), producing its build identity;
#   2. checks the live origin's /perigee-build.json, served index/entry-script bytes,
#      deck PDF (type + bytes), catalog route parity and edge behaviour against it;
#   3. reports the proxied live Python API separately (its version is not exposed).
# Secret-free. Live archive calls (one search + one frame) only when `live` is true.
# workflow_dispatch is offered by GitHub once this file is on the default branch.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Cloudflare origin to verify"
        required: true
        default: "https://perigee.lokesathvik.workers.dev"
      ref:
        description: "Git ref whose build should be deployed there (branch, tag or commit)"
        required: true
        default: "main"
      live:
        description: "Also run one live archive search + frame through the proxy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-release-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: ${{ inputs.base }}
      REF: ${{ inputs.ref }}
      NO_LIVE: ${{ !inputs.live && '--no-live' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the expected release from the ref
        run: |
          (cd frontend && npm ci && npm run build)
          python -m pip install -r backend/requirements-dev.txt
          python cloudflare/build.py > build-info.txt
          python -m pytest -q cloudflare/tests   # also writes the FastAPI route expectations
      - name: Verify the live origin against that build
        run: |
          set +e
          python cloudflare/tests/smoke_local.py --base "$BASE" --cloudflare-edge | tee edge.txt
          edge=${PIPESTATUS[0]}
          python -m backend.platform.smoke --base "$BASE" $NO_LIVE --expect-build cloudflare/build/build-info.json | tee release.txt
          release=${PIPESTATUS[0]}
          built=$(git rev-parse HEAD)
          digest=$(python -c "import json;print(json.load(open('cloudflare/build/public/perigee-build.json'))['release_digest'])")
          {
            echo "### Cloudflare release verification: \`$BASE\`"
            echo "- Expected build: ref \`$REF\` = commit \`$built\`, release_digest \`$digest\`"
            echo "- Edge/static/route checks: exit $edge. Release smoke with expected identity: exit $release"
            echo "- The live Python API (health/search/frame) is a separate deployment; see the report's last section."
            echo '```'
            cat edge.txt release.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$edge" = "0" ] && [ "$release" = "0" ]
