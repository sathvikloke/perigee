name: deploy-check

# Secret-free checks of the Vercel Services layout. Vercel's own Git
# integration builds and deploys; this workflow never deploys anything.
on:
  pull_request:
    paths:
      - "vercel.json"
      - ".vercelignore"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-check.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Config, bundle hygiene and API smoke check
        run: python -m backend.platform.deploy_check --app
      - name: Build frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f dist/index.html
