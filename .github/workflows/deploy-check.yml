name: deploy-check

# Secret-free checks of the Vercel Services layout. Vercel's own Git
# integration builds and deploys; this workflow never deploys anything.
on:
  pull_request:
    paths:
      - "vercel.json"
      - ".vercelignore"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-check.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Config, bundle hygiene and API smoke check
        run: python -m backend.platform.deploy_check --app
      - name: Build frontend
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f dist/index.html
