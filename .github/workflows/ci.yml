name: ci

# Secret-free checks of the code that is actually deployed:
#   - backend: the full pytest suite (raw-data tests skip honestly: no FITS archive in CI)
#   - frontend + cloudflare: typecheck, Vitest, production build, then the Cloudflare
#     export, export==FastAPI parity, build-identity and Worker tests, in that order
# Nothing here deploys, uses secrets, or calls the live archive (IRSA). The live
# release check is the separate, bounded release-smoke / cloudflare-release-verify.
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "cloudflare/**"
      - "tools/ingest/**"
      - "science/reviews/acceptance/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies (pinned)
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests (raw-data tests skip without PERIGEE_DATA_ROOT)
        run: |
          set -o pipefail
          python -m pytest backend -q -rs | tee pytest.txt
          {
            echo "### Backend tests"
            echo '```'
            tail -n 25 pytest.txt
            echo '```'
            echo "Raw SPHEREx FITS are not available in CI; tests that need them are reported as skipped above, not passed."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Frontend production build
        working-directory: frontend
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/demo/perigee-demo.pdf
      - name: Install backend dependencies (pinned; the exporter uses the real catalog code)
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Cloudflare export (cloudflare/build.py)
        run: python cloudflare/build.py > build-info.txt
      - name: Export parity with FastAPI and build identity (pytest; writes route expectations)
        run: python -m pytest -q cloudflare/tests
      - name: Worker tests (node --test; replays the recorded FastAPI answers)
        run: node --test cloudflare/test/*.test.mjs
      - name: Report the CI build identity
        if: always()
        run: |
          if [ -f cloudflare/build/public/perigee-build.json ]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          i = json.load(open("cloudflare/build/public/perigee-build.json"))
          print("### Cloudflare static build identity (this CI build)")
          print(f"- release_digest: `{i['release_digest']}`")
          print(f"- frontend digest `{i['frontend']['digest'][:16]}`, catalog digest `{i['catalog']['digest'][:16]}` ({i['catalog']['content_version']})")
          print(f"- deck PDF sha256 `{i['demo_pdf']['sha256'][:16]}`, source `{i['source']['label']}`")
          print("- This is what a Cloudflare deploy of this commit should publish at /perigee-build.json. CI does not deploy;")
          print("  a manual deploy is verified with the cloudflare-release-verify workflow.")
          EOF
          fi
